# G1 (29 dof) with Unitree Dex3-1 three-finger hands, unitree_hg IDL.
#
#   ./unitree_mujoco -r g1_dex3 -s scene_29dof.xml
#
# The body is the plain G1 model (scenes from unitree_robots/g1); the hands are attached at load
# time (see simulate/src/robot_compose.h). Mounting from unitree_ros
# robots/g1_description/g1_29dof_with_hand.urdf: <side>_hand_palm_link is fixed to
# <side>_wrist_yaw_link at (0.0415, +-0.003, 0) with no rotation, and the wrist yaw link loses the
# rubber hand (its inertial becomes the URDF's).
scene_dir: g1
idl: hg
# The hands add actuators and sensors, so the G1 motors are mapped by name (same numbering as rt/lowcmd).
motors:
  0: left_hip_pitch
  1: left_hip_roll
  2: left_hip_yaw
  3: left_knee
  4: left_ankle_pitch
  5: left_ankle_roll
  6: right_hip_pitch
  7: right_hip_roll
  8: right_hip_yaw
  9: right_knee
  10: right_ankle_pitch
  11: right_ankle_roll
  12: waist_yaw
  13: waist_roll
  14: waist_pitch
  15: left_shoulder_pitch
  16: left_shoulder_roll
  17: left_shoulder_yaw
  18: left_elbow
  19: left_wrist_roll
  20: left_wrist_pitch
  21: left_wrist_yaw
  22: right_shoulder_pitch
  23: right_shoulder_roll
  24: right_shoulder_yaw
  25: right_elbow
  26: right_wrist_roll
  27: right_wrist_pitch
  28: right_wrist_yaw
attachments:
  # components/dex3_1/left.xml, names prefixed "left_" (left_hand_thumb_0_joint, left_hand_thumb_0, ...)
  - type: dex3_1
    side: left
    mount: left_wrist_yaw_link
    pos: [0.0415, 0.003, 0]
    remove_mesh_geoms: [left_rubber_hand]
    mount_inertial:
      mass: 0.08457647
      pos: [0.02200381568, 0.00049485096, 0.00053861123]
      fullinertia: [4.929128828e-05, 5.973338134e-05, 3.928083826e-05, -4.5735494e-07, 4.45867591e-06, 4.3217198e-07]
  - type: dex3_1
    side: right
    mount: right_wrist_yaw_link
    pos: [0.0415, -0.003, 0]
    remove_mesh_geoms: [right_rubber_hand]
    mount_inertial:
      mass: 0.08457647
      pos: [0.02200381568, -0.00049485096, 0.00053861123]
      fullinertia: [4.929128828e-05, 5.973338134e-05, 3.928083826e-05, 4.5735494e-07, 4.45867591e-06, -4.3217198e-07]
components:
  - secondary_imu                       # rt/secondary_imu
  - lf_lowstate                         # rt/lf/lowstate
  - lf_sportmodestate                   # rt/lf/sportmodestate
  - bms_state                           # rt/lf/bmsstate
  # rt/dex3/<side>/{cmd,state} (unitree_hg HandCmd_ / HandState_, state 100 Hz) and
  # rt/lf/dex3/<side>/state (10 Hz). Params: side, prefix (default <side>_), topic (default
  # rt/dex3/<side>), hz (100), lf_hz (10, 0 = off)
  - {type: dex3_hand, side: left}
  - {type: dex3_hand, side: right}
